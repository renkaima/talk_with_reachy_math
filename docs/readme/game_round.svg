<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-label="How a round of math games works. First, Reachy offers two of the five games and the child picks one; stories and guessing games use the child's saved theme. Second, Reachy plays five problems from that game: it reads a problem made in code, the child answers aloud, the math coach checks the number, and Reachy praises a right answer and goes on to the next problem, or asks a small helper question. Each game adds its own reply. Third, the round ends: Reachy cheers, reads the story's ending after a story, and offers two other games or a break, which starts the next round. If the child talks about something else, Reachy answers briefly and brings them back; if the child says stop, practice stops and Reachy invites them back a few minutes later.">
  <defs>
    <marker id="gr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="gr-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Card background, so the figure reads on light and dark pages -->
  <rect width="1100" height="600" rx="18" fill="#ffffff"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- 1 Pick a game -->
    <rect x="20" y="20" width="290" height="392" rx="16" fill="#f0f9f8" stroke="#0f766e" stroke-width="2"/>
    <text x="40" y="52" font-size="18" font-weight="700" fill="#0f172a">1  Pick a game</text>
    <text x="40" y="80" font-size="15" fill="#334155">Reachy offers two of the</text>
    <text x="40" y="99" font-size="15" fill="#334155">five games; the child picks.</text>
    <g font-size="15" font-weight="700" fill="#134e4a">
      <rect x="40" y="116" width="250" height="34" rx="17" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
      <text x="58" y="138">Story adventure</text>
      <rect x="40" y="158" width="250" height="34" rx="17" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
      <text x="58" y="180">Fix my mistakes</text>
      <rect x="40" y="200" width="250" height="34" rx="17" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
      <text x="58" y="222">Number riddles</text>
      <rect x="40" y="242" width="250" height="34" rx="17" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
      <text x="58" y="264">Closest guess</text>
      <rect x="40" y="284" width="250" height="34" rx="17" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
      <text x="58" y="306">Quick math</text>
    </g>
    <text x="40" y="346" font-size="15" fill="#334155">Stories and guesses use the</text>
    <text x="40" y="365" font-size="15" fill="#334155">child's theme, such as space</text>
    <text x="40" y="384" font-size="15" fill="#334155">or dogs, saved for next time.</text>

    <!-- 1 to 2 -->
    <line x1="310" y1="200" x2="347" y2="200" stroke="#334155" stroke-width="2.5" marker-end="url(#gr-arrow)"/>

    <!-- 2 Five problems -->
    <rect x="350" y="20" width="460" height="392" rx="16" fill="#f0f9f8" stroke="#0f766e" stroke-width="2"/>
    <text x="370" y="52" font-size="18" font-weight="700" fill="#0f172a">2  Five problems from that game</text>

    <g font-size="15" fill="#0f172a">
      <rect x="404" y="72" width="184" height="52" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
      <text x="496" y="94" text-anchor="middle" font-weight="700">Reachy reads</text>
      <text x="496" y="113" text-anchor="middle" font-size="14.5" fill="#475569">a problem made in code</text>

      <rect x="404" y="148" width="184" height="52" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
      <text x="496" y="170" text-anchor="middle" font-weight="700">Child answers</text>
      <text x="496" y="189" text-anchor="middle" font-size="14.5" fill="#475569">aloud</text>

      <rect x="404" y="224" width="184" height="52" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
      <text x="496" y="246" text-anchor="middle" font-weight="700">Math coach checks</text>
      <text x="496" y="265" text-anchor="middle" font-size="14.5" fill="#134e4a">the number</text>

      <rect x="404" y="300" width="184" height="100" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
      <text x="418" y="324" font-weight="700">Right:</text>
      <text x="468" y="324" font-size="14.5" fill="#475569">praise and</text>
      <text x="418" y="343" font-size="14.5" fill="#475569">the next problem</text>
      <text x="418" y="368" font-weight="700">Not yet:</text>
      <text x="483" y="368" font-size="14.5" fill="#475569">a small</text>
      <text x="418" y="387" font-size="14.5" fill="#475569">helper question</text>
    </g>
    <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#gr-arrow)">
      <line x1="496" y1="124" x2="496" y2="145"/>
      <line x1="496" y1="200" x2="496" y2="221"/>
      <line x1="496" y1="276" x2="496" y2="297"/>
      <!-- loop back to the next problem -->
      <path d="M404 342 H382 V98 H401"/>
    </g>
    <text x="366" y="226" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">×5</text>

    <!-- Each game's own reply -->
    <rect x="612" y="72" width="180" height="328" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="626" y="96" font-size="15" font-weight="700" fill="#0f172a">Each game adds</text>
    <text x="626" y="115" font-size="15" font-weight="700" fill="#0f172a">its own reply</text>
    <g font-size="14.5" fill="#134e4a">
      <text x="626" y="148" font-weight="700">Riddles</text>
      <text x="626" y="167">names the clue a</text>
      <text x="626" y="185">wrong guess breaks</text>
      <text x="626" y="218" font-weight="700">Fix my mistakes</text>
      <text x="626" y="237">"What did I do</text>
      <text x="626" y="255">wrong?"</text>
      <text x="626" y="288" font-weight="700">Closest guess</text>
      <text x="626" y="307">says its own guess</text>
      <text x="626" y="325">and who was closer</text>
      <text x="626" y="358" font-weight="700">Story adventure</text>
      <text x="626" y="377">each answer moves</text>
      <text x="626" y="395">the story on</text>
    </g>

    <!-- 2 to 3 -->
    <line x1="810" y1="200" x2="847" y2="200" stroke="#334155" stroke-width="2.5" marker-end="url(#gr-arrow)"/>

    <!-- 3 Round ends -->
    <rect x="850" y="20" width="230" height="392" rx="16" fill="#f0f9f8" stroke="#0f766e" stroke-width="2"/>
    <text x="870" y="52" font-size="18" font-weight="700" fill="#0f172a">3  Round ends</text>
    <g font-size="15" fill="#334155">
      <text x="870" y="86">Reachy cheers the</text>
      <text x="870" y="105">round. After a story,</text>
      <text x="870" y="124">it reads the ending.</text>
      <text x="870" y="166">Then it offers two</text>
      <text x="870" y="185">other games, or a</text>
      <text x="870" y="204">short break.</text>
      <text x="870" y="246">Over three rounds,</text>
      <text x="870" y="265">every game comes up.</text>
      <text x="870" y="307">Each child's levels and</text>
      <text x="870" y="326">theme are saved and</text>
      <text x="870" y="345">found again by voice.</text>
    </g>

    <!-- next round: 3 back to 1 -->
    <path d="M965 412 V440 H165 V415" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#gr-arrow-teal)"/>
    <text x="565" y="433" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">next round</text>

    <!-- Along the way -->
    <text x="20" y="484" font-size="16" font-weight="700" fill="#0f172a">Along the way</text>
    <rect x="20" y="498" width="525" height="84" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="38" y="524" font-size="15" font-weight="700" fill="#0f172a">The child talks about something else</text>
    <text x="38" y="546" font-size="14.5" fill="#334155">Reachy answers in one sentence, then brings them back.</text>
    <text x="38" y="566" font-size="14.5" fill="#334155">The app reminds it after 2 and 5 turns off topic.</text>

    <rect x="555" y="498" width="525" height="84" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="573" y="524" font-size="15" font-weight="700" fill="#0f172a">The child says "stop" or "I'm done"</text>
    <text x="573" y="546" font-size="14.5" fill="#334155">Practice stops, and Reachy keeps chatting. It invites</text>
    <text x="573" y="566" font-size="14.5" fill="#334155">them back to a game about three minutes later.</text>
  </g>
</svg>
