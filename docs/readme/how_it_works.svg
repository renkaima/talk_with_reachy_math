<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 640" role="img" aria-label="How the app works. Speech goes from the microphone to a speech service that recognizes it, answers with a language model, and speaks the reply through Reachy. At the same time, the app on the robot keeps a copy of the audio, identifies the speaker by voice on the device, writes one record per utterance with words, times, and speaker ID, and uploads the data folder to Google Drive every five minutes. Voice ID also sends the model a hidden note saying who is speaking and what Reachy remembers about them.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Card background, so the figure reads on light and dark pages -->
  <rect width="1220" height="640" rx="18" fill="#ffffff"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- People -->
    <g fill="#334155">
      <circle cx="110" cy="138" r="22"/>
      <path d="M70 212 C70 182 86 168 110 168 C134 168 150 182 150 212 Z"/>
      <circle cx="150" cy="150" r="15" fill-opacity="0.55"/>
      <path d="M124 212 C124 192 134 180 150 180 C166 180 176 192 176 212 Z" fill-opacity="0.55"/>
    </g>
    <text x="118" y="244" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">People</text>

    <!-- The robot -->
    <rect x="224" y="20" width="572" height="600" rx="16" fill="#f0f9f8" stroke="#0f766e" stroke-width="2"/>
    <text x="244" y="50" font-size="18" font-weight="700" fill="#0f172a">On Reachy Mini: this app</text>
    <text x="244" y="70" font-size="14.5" fill="#475569">runs on the robot, or on a Mac in the simulation</text>

    <g font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">
      <rect x="260" y="84" width="210" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
      <text x="365" y="110">Speaker &amp; motors</text>
      <text x="365" y="130" font-size="14.5" font-weight="400" fill="#475569">voice, head, emotions</text>

      <rect x="260" y="190" width="210" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
      <text x="365" y="226">Microphone</text>

      <rect x="260" y="320" width="210" height="70" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
      <text x="365" y="350">Voice ID</text>
      <text x="365" y="371" font-size="14.5" font-weight="400" fill="#134e4a">voiceprints, on device</text>

      <rect x="560" y="320" width="210" height="70" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
      <text x="665" y="350">Study recorder</text>
      <text x="665" y="371" font-size="14.5" font-weight="400" fill="#134e4a">one record per utterance</text>

      <rect x="560" y="450" width="210" height="70" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
      <text x="665" y="480">Data folder</text>
      <text x="665" y="501" font-size="14.5" font-weight="400" fill="#134e4a">JSONL · CSV · audio clips</text>
    </g>

    <!-- The speech service -->
    <rect x="830" y="20" width="370" height="290" rx="16" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="850" y="50" font-size="18" font-weight="700" fill="#0f172a">Speech service</text>
    <text x="850" y="70" font-size="14.5" fill="#475569">on Hugging Face (Pollen's server by default)</text>

    <g font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">
      <rect x="850" y="84" width="180" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
      <text x="940" y="119">Speech synthesis</text>
      <rect x="850" y="190" width="180" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
      <text x="940" y="225">Speech recognition</text>
      <rect x="1060" y="84" width="122" height="166" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
      <text x="1121" y="161">Language</text>
      <text x="1121" y="181">model</text>
    </g>

    <!-- Google Drive -->
    <rect x="870" y="450" width="210" height="70" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="975" y="480" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Google Drive</text>
    <text x="975" y="501" font-size="14.5" fill="#134e4a" text-anchor="middle">a folder you choose</text>

    <!-- Conversation path -->
    <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <line x1="182" y1="220" x2="257" y2="220"/>
      <line x1="260" y1="114" x2="185" y2="114"/>
      <line x1="470" y1="220" x2="847" y2="220"/>
      <line x1="1030" y1="220" x2="1057" y2="220"/>
      <line x1="1060" y1="114" x2="1033" y2="114"/>
      <line x1="850" y1="114" x2="473" y2="114"/>
    </g>
    <g font-size="15" fill="#334155" text-anchor="middle">
      <text x="220" y="210">talk</text>
      <text x="222" y="104">hear</text>
      <text x="660" y="210">live audio</text>
      <text x="660" y="104">spoken reply + moves (tool calls)</text>
    </g>

    <!-- Recording path, added by this app -->
    <g stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)">
      <line x1="365" y1="250" x2="365" y2="317"/>
      <line x1="470" y1="355" x2="557" y2="355"/>
      <polyline points="940,250 940,355 773,355"/>
      <line x1="665" y1="390" x2="665" y2="447"/>
      <line x1="770" y1="485" x2="867" y2="485"/>
      <polyline points="365,390 365,580 1121,580 1121,253" stroke-dasharray="8 6"/>
    </g>
    <g font-size="15" fill="#0f766e" text-anchor="middle">
      <text x="378" y="290" text-anchor="start">copy of the audio</text>
      <text x="515" y="345">speaker ID</text>
      <text x="515" y="374">+ clip</text>
      <text x="952" y="333" text-anchor="start">words +</text>
      <text x="952" y="351" text-anchor="start">start/end times</text>
      <text x="678" y="424" text-anchor="start">writes</text>
      <text x="818" y="475">every</text>
      <text x="818" y="507">5 min</text>
      <text x="380" y="552" text-anchor="start">hidden note to the model:</text>
      <text x="380" y="570" text-anchor="start">who is speaking + what Reachy remembers about them</text>
    </g>

    <!-- Legend -->
    <rect x="244" y="598" width="16" height="12" rx="3" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="268" y="609" font-size="14.5" fill="#334155">added by this app (Pollen's conversation app has the rest)</text>
  </g>
</svg>
